; PlatformIO Project Configuration File
;
; ESP32-C6 + SCD41 CO2 Sensor with Zigbee

[env:esp32c6-zigbee-bedroom]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf

board_build.flash_size = 4MB
board_build.partitions = zigbee.csv
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 460800

; Temperature calibration offset (°C) — override per-device
build_src_flags = -DTEMP_OFFSET_C=1.0f

[env:esp32c6-zigbee-office]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf

board_build.flash_size = 4MB
board_build.partitions = zigbee.csv
board_upload.flash_size = 4MB

monitor_speed = 115200
upload_speed = 460800

; Temperature calibration offset (°C) — override per-device
; CO2_LED_DEFAULT: 1=show CO2 color on LED, 0=LED off by default
build_src_flags = -DTEMP_OFFSET_C=7.0f -DCO2_LED_DEFAULT=1
